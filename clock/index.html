<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>project clock</title>

    <style>
       * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
       }
       body{
         background-color: antiquewhite;
         display: flex;
         justify-content: center;
         align-items: center;
         height: 100vh;
       }
       .clock{
         position: relative;
         width: 250px;
         height: 250px;
         border-radius: 50%;
         background-color: white; border: 8px solid black;
         box-shadow: 0px 4px 8px rgb(0 0 0 / 0.3);
       }
       .circle{
         position: absolute;
         top: 50%;
         left: 50%;
         transform: translate(-50%, -50%);
         width: 20px;
         height: 20px;
         background-color: darkslategrey;
         border-radius: 50%;

       }
       .hour, .minute, .second{
         position: absolute;
         top: 50%;
         left: 50%;
         background-color: #333;
         transform-origin: 50% 100%;
         border-radius: 10px;

       }
       .hour{
         width: 7px;
         height: 60px;
         background-color: black;
       }
       .minute{
         width: 5px;
         height: 83px;
         background-color: #333;

       }
       .second{
         width: 3px;
         height: 104px;
       }
      @keyframes  hour-rotation{
        from{
            transform: translate(-50%,-100%) rotate(0deg);
        }
        to{
            
            transform: translate(-50%,-100%) rotate(360deg);
        }
      }
       
       @keyframes minute-rotation{
         from{
             transform: translate(-50%,-100% ) rotate(0deg);
         }
         to{ transform: translate(-50%,-100% ) rotate(360deg);

         }
       }
       @keyframes second-rotation{
         from{
             transform: translate(-50%, -100% ) rotate(0deg);
         }
         to{ transform: translate(-50%, -100% ) rotate(360deg);

         }
       }

       .hour{
        animation: hour-rotation 43200s infinite linear;
       }
       .minute{
        animation: hour-rotation 3600s infinite linear;
       }
       .second{
        animation: hour-rotation 60s infinite linear;
       }
    </style>
  </head>
  <body>
    <div class="clock">
      <div class="hour"></div>
      <div class="minute"></div>
      <div class="second"></div>
      <div class="circle"></div>
    </div>
  </body>
</html>
