<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transitions</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>transitions</h1>
      <p>learning ransitions,transformation and animation</p>
    </header>
    <main>
      <section>
        <!--transition-->
        <h2>css transitions</h2>
        <div class="cointainer">
          <div class="card">hug me</div>
          <button class="bn">welcome</button>
        </div>
      </section>
      <section>
        <!--transformation-->
        <h2>css transformation</h2>
        <div class="cointainer">
          <div class="square">hug me</div>
          <img src="https://palceholder.com" alt="" width="100px" height="80px"/>
        </div>
      </section>
      <section>
        <!--animation-->
        <h2>css animation</h2>
        <div class="cointainer">
          <div class="ball"></div>
          <p class="anim">welcome to this course</p>
        </div>
      </section>
    </main>
  </body>
</html>
